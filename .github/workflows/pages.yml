name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build (inject MapTiler key)
        run: npm run build
        env:
          MAPTILER_KEY: ${{ secrets.MAPTILER_KEY }}

      - name: Collect site files
        run: |
          mkdir _site
          cp index.html _site/
          cp -r js css _site/   # adjust to the folders your site really uses

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4